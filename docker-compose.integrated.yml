# Run from rustdesk-console; the server and web repositories are siblings.
services:
  rustdesk-console:
    build: .
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      HBBS_MANAGEMENT_URL: http://hbbs:21120
      SERVER_MANAGEMENT_TOKEN: ${SERVER_MANAGEMENT_TOKEN:?Set SERVER_MANAGEMENT_TOKEN}
      SERVER_MANAGEMENT_NODE_ID: main
    volumes:
      - ./data/console:/data
    networks: [rustdesk]

  rustdesk-console-web:
    build: ../rustdesk-console-web
    restart: unless-stopped
    ports: ['127.0.0.1:21114:80']
    environment:
      BACKEND_URL: http://rustdesk-console:3000
    depends_on: [rustdesk-console]
    networks: [rustdesk]

  hbbs:
    build:
      context: ../rustdesk-server
      dockerfile: docker-managed/Dockerfile
    image: rustdesk-server-managed:local
    container_name: hbbs
    command: [hbbs, -r, '${RUSTDESK_RELAY_ADDRESS:?Set RUSTDESK_RELAY_ADDRESS}']
    restart: unless-stopped
    environment:
      RD_MANAGEMENT_BIND: 0.0.0.0:21120
      RD_MANAGEMENT_TOKEN: ${SERVER_MANAGEMENT_TOKEN:?Set SERVER_MANAGEMENT_TOKEN}
      RD_MANAGEMENT_DIR: /data/management
    ports: ['21115:21115', '21116:21116', '21116:21116/udp', '21118:21118']
    volumes:
      - ./data/server:/data
    networks: [rustdesk]

  hbbr:
    build:
      context: ../rustdesk-server
      dockerfile: docker-managed/Dockerfile
    image: rustdesk-server-managed:local
    container_name: hbbr
    command: [hbbr]
    restart: unless-stopped
    environment:
      RD_HBBS_API_URL: http://hbbs:21120
      RD_MANAGEMENT_TOKEN: ${SERVER_MANAGEMENT_TOKEN:?Set SERVER_MANAGEMENT_TOKEN}
      RD_RELAY_ID: relay-1
      RD_RELAY_ADDRESS: ${RUSTDESK_RELAY_ADDRESS:?Set RUSTDESK_RELAY_ADDRESS}
    ports: ['21117:21117', '21119:21119']
    volumes:
      - ./data/server-relay:/data
    networks: [rustdesk]

networks:
  rustdesk:
