name: RustDesk integrated deployment

on:
  workflow_dispatch:
    inputs:
      server_ref:
        description: rustdesk-server ref containing the management changes
        required: true
      web_ref:
        description: rustdesk-console-web ref containing the management changes
        required: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: rustdesk-console
      - uses: actions/checkout@v7
        with:
          repository: databk/rustdesk-server
          ref: ${{ inputs.server_ref }}
          submodules: recursive
          path: rustdesk-server
      - uses: actions/checkout@v7
        with:
          repository: databk/rustdesk-console-web
          ref: ${{ inputs.web_ref }}
          path: rustdesk-console-web
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify the cross-repository configuration contract
        run: cmp rustdesk-console/agent/schema.json rustdesk-server/management-schema.json
      - name: Prepare ephemeral CI credentials
        working-directory: rustdesk-console
        run: |
          umask 077
          printf 'JWT_SECRET=%s\nNODE_AGENT_TOKEN=%s\nSERVER_MANAGEMENT_TOKEN=%s\nRUSTDESK_RELAY_ADDRESS=localhost:21117\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env.integrated
      - name: Build and start the integrated stack
        working-directory: rustdesk-console
        run: docker compose --env-file .env.integrated -f docker-compose.integrated.yml up -d --build
      - name: Exercise the integrated management flow
        working-directory: rustdesk-console
        run: node scripts/server-management-smoke.mjs
      - name: Tear down the CI stack
        if: always()
        working-directory: rustdesk-console
        run: docker compose --env-file .env.integrated -f docker-compose.integrated.yml down -v
