name: Docker Hub Overview

# Keeps the Docker Hub repository page (README / overview) in sync with
# docs/dockerhub-overview.zh-CN.md. Runs in seconds and never builds images.
# Trigger: any push that touches the overview file, or a dockerhub-* tag.

on:
  push:
    paths:
      - 'docs/dockerhub-overview.zh-CN.md'
    tags:
      - 'dockerhub-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-overview
  cancel-in-progress: true

jobs:
  sync:
    name: Update Docker Hub overview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Push overview text
        env:
          DU: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DT: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DU:-}" ] || [ -z "${DT:-}" ]; then
            echo "::error::Missing DOCKER_USERNAME/DOCKERHUB_TOKEN repository secrets"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          user = os.environ["DU"]
          token = os.environ["DT"]

          def call(url, payload=None, method="GET", auth=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Content-Type", "application/json")
              if auth:
                  req.add_header("Authorization", auth)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, resp.read()

          _, body = call(
              "https://hub.docker.com/v2/users/login/",
              {"username": user, "password": token},
              "POST",
          )
          jwt = json.loads(body)["token"]

          with open("docs/dockerhub-overview.zh-CN.md", encoding="utf-8") as fh:
              overview = fh.read()

          # A scoped PAT cannot be sent as a bearer token directly; exchange it
          # for a scoped access token via the Hub auth API first.
          bearer = None
          for payload in (
              {"identifier": user, "secret": token},
              {"username": user, "password": token},
          ):
              try:
                  _, auth_body = call(
                      "https://hub.docker.com/v2/auth/token", payload, "POST"
                  )
                  auth_data = json.loads(auth_body)
                  bearer = auth_data.get("access_token") or auth_data.get("token")
                  if bearer:
                      break
              except urllib.error.HTTPError as exc:
                  print("auth/token attempt failed:", exc.code, exc.read().decode()[:200])

          repo_url = f"https://hub.docker.com/v2/repositories/{user}/rustdesk-console/"
          attempts = [("Bearer", bearer)] if bearer else []
          attempts.append(("JWT", jwt))
          last_error = None
          for scheme, credential in attempts:
              try:
                  status, _ = call(
                      repo_url,
                      {"full_description": overview},
                      "PATCH",
                      f"{scheme} {credential}",
                  )
                  print(f"overview updated ({len(overview)} chars, HTTP {status}, auth {scheme})")
                  break
              except urllib.error.HTTPError as exc:
                  last_error = f"{exc.code} {exc.read().decode()[:300]}"
                  print(f"{scheme} auth failed: {last_error}")
          else:
              print("Docker Hub overview update failed:", last_error)
              sys.exit(1)
          PY
