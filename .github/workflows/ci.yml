name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend and network tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: node --test network/*.test.mjs

  server-profile:
    name: Native server profile integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: node --test test/server-profile/compose.integration.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  database-migrations:
    name: Database migrations (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # MySQL is a supported database and must pass on every release line.
    # MariaDB is not supported (it cannot create the functional unique index
    # from FixMySqlDefaultUserGroupIndex); probe it without blocking the PR so
    # the compatibility gap stays visible.
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.0
            image: mysql:8.0
            blocking: true
            healthCmd: mysqladmin ping -h 127.0.0.1 -ptest-password
          - name: MySQL 8.4 LTS
            image: mysql:8.4
            blocking: true
            healthCmd: mysqladmin ping -h 127.0.0.1 -ptest-password
          - name: MySQL latest
            image: mysql:latest
            blocking: true
            healthCmd: mysqladmin ping -h 127.0.0.1 -ptest-password
          # MariaDB 11.4 no longer ships the mysqladmin compatibility
          # symlink; use the healthcheck.sh bundled with the image instead.
          - name: MariaDB 10.6 probe
            image: mariadb:10.6
            blocking: false
            healthCmd: healthcheck.sh --connect --innodb_initialized
          - name: MariaDB 11.4 probe
            image: mariadb:11.4
            blocking: false
            healthCmd: healthcheck.sh --connect --innodb_initialized
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MARIADB_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.healthCmd }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test fresh and existing databases
        env:
          RUN_MYSQL_MIGRATION_TESTS: '1'
          DB_TYPE: mysql
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: test-password
        run: npx jest --runInBand src/database/mysql-migration.integration.spec.ts

      - name: Summarize database version
        if: always()
        run: |
          echo "### ${{ matrix.name }} (${{ matrix.image }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Blocking: ${{ matrix.blocking }}" >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
