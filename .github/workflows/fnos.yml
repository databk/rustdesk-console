name: fnOS Build (FPK)

# 同时打两份 FPK：
#   · Docker 版  — 任何 fnOS（需开 Docker）跨架构一份 FPK
#   · Native 版  — Sea 原生二进制，多架构（x64 + arm64）
#
# Triggers: tag fnos-* 自动 / workflow_dispatch 手动

on:
  push:
    tags:
      - 'fnos-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'FPK 版本号 (e.g. 1.11.10)'
        required: true
        type: string
      frontend_repo:
        description: '前端仓库 (owner/repo)'
        required: true
        default: 'fengyun1980/rustdesk-console-web'
        type: string
      frontend_branch:
        description: '前端分支/tag'
        required: true
        default: 'fnos-setup-wizard'
        type: string
      publish:
        description: '构建后发布到 Release 吗？'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

env:
  FN_PACK_VERSION: '1.3.3'

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. 后端 NestJS dist（Docker 版用）
  # ──────────────────────────────────────────────────────────────────
  backend-build:
    name: Build Backend (NestJS dist)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - id: meta
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          VERSION="${TAG#fnos-}"
          [[ "$TAG" != fnos-* ]] && VERSION="${{ inputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci --ignore-scripts && npm run build

      - uses: actions/upload-artifact@v8
        with:
          name: backend-dist
          path: |
            dist
            package.json
            package-lock.json
            tsconfig*.json
            nest-cli.json
            deployment/

  # ──────────────────────────────────────────────────────────────────
  # 2. 后端 Sea 原生二进制（Native 版用，多架构）
  # ──────────────────────────────────────────────────────────────────
  backend-sea-build:
    name: Build Backend (Sea ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - id: meta
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          VERSION="${TAG#fnos-}"
          [[ "$TAG" != fnos-* ]] && VERSION="${{ inputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: QEMU (arm64 only)
        if: matrix.arch == 'arm64'
        run: |
          docker run --rm --privileged multiarch/qemu-user-static \
            --reset -p yes --credential yes

      - name: Build Sea ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            # arm64 需要交叉编译：用 arm64 Node 镜像 + Docker
            docker run --rm --platform linux/arm64 \
              -v "${PWD}:/src" -w /src \
              node:24-bookworm-slim \
              bash -c 'npm ci --ignore-scripts && npm run build:sea'
          else
            npm ci --ignore-scripts && npm run build:sea
          fi
          ls -la dist-sea/rustdesk-console

      - name: Rename + upload
        run: |
          cp dist-sea/rustdesk-console "rustdesk-console-${{ matrix.arch }}"
          tar czf "sea-${{ matrix.arch }}.tar.gz" \
            -C dist-sea node_modules templates deployment \
            -C . "rustdesk-console-${{ matrix.arch }}"
          ls -lh sea-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@v8
        with:
          name: backend-sea-${{ matrix.arch }}
          path: sea-${{ matrix.arch }}.tar.gz

  # ──────────────────────────────────────────────────────────────────
  # 3. 前端（并行）
  # ──────────────────────────────────────────────────────────────────
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.frontend_repo || 'fengyun1980/rustdesk-console-web' }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.frontend_branch || 'fnos-setup-wizard' }}
          path: frontend

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci --ignore-scripts && npm run build

      - uses: actions/upload-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

  # ──────────────────────────────────────────────────────────────────
  # 4. fnpack 打包 Docker 版 + Native 版
  # ──────────────────────────────────────────────────────────────────
  fpk-build:
    name: fnpack → Docker + Native FPK
    needs: [backend-build, backend-sea-build, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        run: |
          v="${{ needs.backend-build.outputs.version }}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "→ Building fnOS v$v (Docker + Native)"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # ── 组装 Docker 版 ──
      - name: Assemble Docker FPK workspace
        run: |
          set -euo pipefail
          DIR="fnos/.fnpkg-docker"
          rm -rf "$DIR"
          cp -r fnos "$DIR"
          mkdir -p "$DIR/app/docker/web-dist"
          cp -r artifacts/frontend-dist/* "$DIR/app/docker/web-dist/"
          mkdir -p "$DIR/app/docker/backend-src"
          cp -r artifacts/backend-dist/* "$DIR/app/docker/backend-src/"
          sed -i "s/^version.*=.*$/version = ${VERSION}/" "$DIR/manifest"
          echo "✓ Docker FPK workspace ready"

      # ── 组装 Native 版 ──
      - name: Assemble Native FPK workspace
        run: |
          set -euo pipefail
          DIR="fnos-native/.fnpkg-native"
          rm -rf "$DIR"
          cp -r fnos-native "$DIR"

          # 解 Sea 二进制
          for arch in x64 arm64; do
            tar xzf "artifacts/backend-sea-${arch}/sea-${arch}.tar.gz" \
              -C "$DIR/bin/"
            chmod +x "$DIR/bin/rustdesk-console-${arch}"
          done

          # node_modules / templates / deployment 共用 x64 那份（同版本）
          tar xzf "artifacts/backend-sea-x64/sea-x64.tar.gz" \
            --wildcards 'node_modules/*' 'templates/*' 'deployment/*' \
            -C "$DIR/bin/"

          # 前端静态资源
          cp -r artifacts/frontend-dist/* "$DIR/public/"

          sed -i "s/^version.*=.*$/version = ${VERSION}/" "$DIR/manifest"
          sed -i "s/^display_name.*=.*$/display_name = RustDesk Console (Native)/" "$DIR/manifest"
          echo "✓ Native FPK workspace ready"

      # ── fnpack CLI ──
      - name: Download fnpack
        run: |
          curl -fsSL "https://static2.fnnas.com/fnpack/fnpack-${FN_PACK_VERSION}-linux-amd64" -o fnpack
          chmod +x fnpack

      # ── Build Docker FPK ──
      - name: Build Docker .fpk
        env:
          CERT: ${{ secrets.FNOS_DEV_CERT }}
          KEY:  ${{ secrets.FNOS_DEV_KEY }}
        run: |
          if [ -n "$CERT" ] && [ -n "$KEY" ]; then
            ./fnpack build -d fnos/.fnpkg-docker \
              --cert <(echo "$CERT" | base64 -d) --key <(echo "$KEY" | base64 -d)
          else
            ./fnpack build -d fnos/.fnpkg-docker --nosign
          fi
          mv rustdesk-console.fpk "rustdesk-console-docker-${VERSION}.fpk"
          ls -lh rustdesk-console-docker-*.fpk

      # ── Build Native FPK ──
      - name: Build Native .fpk
        env:
          CERT: ${{ secrets.FNOS_DEV_CERT }}
          KEY:  ${{ secrets.FNOS_DEV_KEY }}
        run: |
          if [ -n "$CERT" ] && [ -n "$KEY" ]; then
            ./fnpack build -d fnos-native/.fnpkg-native \
              --cert <(echo "$CERT" | base64 -d) --key <(echo "$KEY" | base64 -d)
          else
            ./fnpack build -d fnos-native/.fnpkg-native --nosign
          fi
          mv rustdesk-console.fpk "rustdesk-console-native-${VERSION}.fpk"
          ls -lh rustdesk-console-native-*.fpk

      # ── Upload artifacts ──
      - name: Upload FPKs
        uses: actions/upload-artifact@v8
        with:
          name: fnos-fpks
          path: rustdesk-console-*.fpk

      # ── Release ──
      - name: Upload to Release
        if: ${{ (inputs.publish == true) || (github.event_name == 'push') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: fnOS RustDesk Console v${{ env.VERSION }}
          body: |
            ## RustDesk Console · fnOS v${{ env.VERSION }}

            ### 包含（Setup Wizard）
            - 首次安装进入 `/setup` 向导，**一处填写 serverUrl + admin 账号**
            - 系统自动配置：常规设置 + ServerManagement（hbbs）+ Web Client
            - ServerManagement.token 取自 `JWT_SECRET`
            - Web Client 公钥自动从 hbbs `GET /v1/status` 拉取

            ### 两个安装包

            | FPK | 适用 | 体积 | 要求 |
            |-----|------|------|------|
            | **Docker 版** | 所有 fnOS (x86/arm/loongarch/riscv) | ~? | fnOS Docker 已启用 |
            | **Native 版** | fnOS x86_64 / aarch64 | ~72 MB | 无需 Docker |

            ### 版本来源
            - 后端: `fengyun1980/rustdesk-console` @ ${{ github.sha }}
            - 前端: ${{ github.event_name == 'workflow_dispatch' && inputs.frontend_repo || 'fengyun1980/rustdesk-console-web' }} @ ${{ github.event_name == 'workflow_dispatch' && inputs.frontend_branch || 'fnos-setup-wizard' }}

            ### 安装后
            打开浏览器 → 自动跳 `/setup` → 填地址 → 填 admin 账号 → 确认无误 → 进入系统
          files: rustdesk-console-*.fpk
          fail_on_unmatched_files: true
