name: Nightly Build

on:
  schedule:
    # Run daily at 00:00 CST (16:00 UTC)
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  check-commits:
    name: Check for New Commits
    runs-on: ubuntu-latest
    outputs:
      has_new_commits: ${{ steps.check.outputs.has_new_commits }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for new commits since last nightly
        id: check
        run: |
          if git tag -l "nightly" | grep -q "nightly"; then
            COMMIT_COUNT=$(git rev-list "nightly..HEAD" --count)
            if [ "$COMMIT_COUNT" -gt 0 ]; then
              echo "Found ${COMMIT_COUNT} new commits since nightly, proceeding with build"
              echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
            else
              echo "No new commits since nightly, skipping build"
              echo "has_new_commits=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No previous nightly tag found, proceeding with build"
            echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
          fi

  nightly:
    name: Nightly Build
    needs: check-commits
    if: ${{ needs.check-commits.outputs.has_new_commits == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Generate nightly version
        id: version
        run: |
          BASE_VERSION=$(jq -r '.version' package.json)
          DATE=$(date +%Y%m%d)
          VERSION="${BASE_VERSION}-nightly.${DATE}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Nightly version: ${VERSION}"

      - name: Build and push Docker images
        run: |
          VERSION=${{ steps.version.outputs.version }}

          docker buildx create --use

          # Login to Docker Hub
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          # Login to GitHub Container Registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Build and push to Docker Hub and GitHub Container Registry
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            --build-arg APP_VERSION=$VERSION \
            --tag databk/rustdesk-console:nightly \
            --tag ghcr.io/databk/rustdesk-console:nightly \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: Delete existing nightly tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing release if it exists
          gh release delete nightly --yes || true
          # Delete existing remote tag if it exists
          git push origin --delete nightly || true
          # Delete existing local tag if it exists
          git tag -d nightly || true

      - name: Generate changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          skip-tag: 'true'
          skip-commit: 'true'
          skip-on-empty: 'false'

      - name: Prepare release body
        env:
          CHANGELOG: ${{ steps.changelog.outputs.clean_changelog }}
        run: |
          if [ -z "$CHANGELOG" ]; then
            printf '## What'\''s Changed\n\n- No significant changes\n' > RELEASE_BODY.md
          else
            printf '%s\n' "$CHANGELOG" > RELEASE_BODY.md
          fi

      - name: Create nightly tag
        run: |
          git tag nightly
          git push origin nightly

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly ${{ steps.version.outputs.version }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: true

  sea-build:
    name: Build SEA (${{ matrix.target }})
    needs: nightly
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: win-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set nightly version in package.json
        shell: bash
        run: |
          VERSION=${{ needs.nightly.outputs.version }}
          # Update version in package.json for SEA build
          node -e "const pkg = require('./package.json'); pkg.version = '${VERSION}'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Build SEA executable
        run: npm run build:sea

      - name: Create archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist-sea
          tar czf ../rustdesk-console-${{ matrix.target }}.tar.gz .

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist-sea/* -DestinationPath rustdesk-console-${{ matrix.target }}.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          files: |
            rustdesk-console-${{ matrix.target }}.tar.gz
            rustdesk-console-${{ matrix.target }}.zip
          fail_on_unmatched_files: false
