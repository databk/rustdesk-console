; All-in-one runtime: nginx and the API are supervised in one container.
;
; supervisord runs as root (container PID 1) because the container runtime
; hands it a /dev/stdout that a non-root user cannot re-open. Every program
; itself runs unprivileged: nginx masters as root but drops workers to
; `nginx`, the API runs as UID 1000 (`node`).

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autostart=true
autorestart=true
startsecs=2
stopsignal=QUIT
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=/bin/sh -c 'if [ "${DB_MIGRATE_ON_START:-1}" = 1 ]; then node dist/main.js migrate || exit $?; fi; exec node dist/main.js'
directory=/app
user=node
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
