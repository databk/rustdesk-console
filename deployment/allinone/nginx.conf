# All-in-one runtime: nginx serves the web console and proxies /api to the
# Node process on 127.0.0.1:3000. The master process runs as root so it can
# open /dev/stdout and /dev/stderr for logging; workers drop to `nginx`.

user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    # Custom client builds can be uploaded through the console (up to 200 MB).
    client_max_body_size 200m;

    # Non-root runtime: all temporary paths must be writable by UID 1000.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/wasm;

    upstream console_backend {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # The web client signs its assets with the served index and worker
        # manifest, so entries that change per build must not be cached.
        location = /index.html {
            expires -1;
        }

        location = /sw.js {
            try_files $uri =404;
            expires -1;
        }

        location = /web-client-worker.json {
            try_files $uri =404;
            expires -1;
        }

        # Build metadata written by the console-web build.
        location = /system-update-health.json {
            try_files $uri =404;
            expires -1;
        }

        # Web-client gateway needs the WebSocket upgrade and long idle reads.
        location = /api/web-client/socket {
            proxy_pass http://console_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 8h;
            proxy_send_timeout 60s;
            proxy_buffering off;
        }

        # ^~ keeps /api/ ahead of the static-asset regex below (API paths may
        # end in .png/.ico and must be proxied, not served from disk).
        location ^~ /api/ {
            proxy_pass http://console_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Hashed bundles are immutable.
        location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            expires 1y;
        }

        # SPA fallback for client-side routes (/setup, /login, ...).
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
